name = "job-search-tracker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# API-only worker - no page-serving, so no text-import rule needed (the
# client at ../client/ is a separate deployable, see its own wrangler.toml).

# Created by: wrangler d1 create job-search-tracker-db
# Paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "job-search-tracker-db"
database_id = "104f139f-bc84-4e72-8034-8541ef563ae4"
migrations_dir = "./migrations"
