<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F5F9; --surface:#FFFFFF; --surface2:#ECEEF6; --line:#DCDFEB;
  --ink:#14172A; --ink2:#555B77; --ink3:#868CA6;
  --accent:#0F766E; --accent-soft:#D8F3F0;
  --good:#226642; --warn:#96600F; --crit:#A93A31;
  --pri-0:#1D4ED8; --pri-0-soft:#DBEAFE;
  --pri-1:#BE185D; --pri-1-soft:#FCE7F3;
  --pri-2:#047857; --pri-2-soft:#D1FAE5;
  --pri-3:#B45309; --pri-3-soft:#FEF3C7;
  --pri-4:#6D28D9; --pri-4-soft:#EDE9FE;
  --shadow:0 1px 2px rgba(20,23,42,.06),0 8px 24px -12px rgba(20,23,42,.18);
}
/* Dark palette applies by OS/browser preference (prefers-color-scheme),
   unless the theme toggle (#themeToggle, see the script at the bottom of
   the page) has set an explicit choice via the data-theme attribute -
   :not([data-theme="light"]) lets an explicit dark choice fall through
   here too, and the [data-theme="dark"] block below covers explicit dark
   when the OS preference itself is light. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1018; --surface:#161925; --surface2:#1E2230; --line:#2A2F41;
  --ink:#E9EBF4; --ink2:#A3AAC3; --ink3:#717892;
  --accent:#2DD4BF; --accent-soft:#0F2E2A;
  --good:#4FBE85; --warn:#DFA63C; --crit:#E8756A;
  --pri-0:#60A5FA; --pri-0-soft:#14243F;
  --pri-1:#F472B6; --pri-1-soft:#3A1830;
  --pri-2:#34D399; --pri-2-soft:#0C2C22;
  --pri-3:#FBBF24; --pri-3-soft:#332309;
  --pri-4:#A78BFA; --pri-4-soft:#241C3D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0E1018; --surface:#161925; --surface2:#1E2230; --line:#2A2F41;
  --ink:#E9EBF4; --ink2:#A3AAC3; --ink3:#717892;
  --accent:#2DD4BF; --accent-soft:#0F2E2A;
  --good:#4FBE85; --warn:#DFA63C; --crit:#E8756A;
  --pri-0:#60A5FA; --pri-0-soft:#14243F;
  --pri-1:#F472B6; --pri-1-soft:#3A1830;
  --pri-2:#34D399; --pri-2-soft:#0C2C22;
  --pri-3:#FBBF24; --pri-3-soft:#332309;
  --pri-4:#A78BFA; --pri-4-soft:#241C3D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 72px}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.hdr{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;padding:30px 0 18px}
.hdr h1{font-size:clamp(24px,3.6vw,33px);font-weight:700}
.hdr .sub{color:var(--ink2);font-size:14px;margin-top:5px}
.hdr-right{display:flex;align-items:center;gap:12px}
#themeToggle{font-size:15px;line-height:1;padding:6px 9px}
.stamp{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:9px}
.who{font-size:12px;color:var(--ink3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--ink3)}
.dot.bad{background:var(--crit)}

.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  background:var(--ground);padding-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;border:0;background:none;cursor:pointer;color:var(--ink2);
  font:inherit;font-weight:500;padding:11px 14px;border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);
  background:var(--surface2);padding:1px 6px;border-radius:9px}
.tab[aria-selected="true"] .n{color:var(--accent);background:var(--accent-soft)}
/* Only shown when a track's scheduled search is stale or errored - see
   runState()/tabsHtml(). Deliberately a bare dot rather than a count badge:
   it's a "look here" marker, and the actual explanation lives one click
   away on the tab itself. */
.tab .tabwarn{width:6px;height:6px;border-radius:50%;flex:none;margin-left:-2px}
.tab .tabwarn.stale{background:var(--warn)}
.tab .tabwarn.error{background:var(--crit)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:16px 0 12px}
.search{flex:1;min-width:180px;max-width:320px}
input[type=search],input[type=text],input[type=date],input[type=password],select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:34px}
.btn{appearance:none;font:inherit;font-weight:500;cursor:pointer;border-radius:7px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
/* Dark-mode accent (#2DD4BF) is bright enough that white button text fails
   contrast - needs the same OS-preference-or-explicit-toggle guard as the
   :root custom-property blocks above, not just the bare media query, or
   toggling to dark while the OS is light leaves this rule un-applied. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#241B08}}
:root[data-theme="dark"] .btn.primary{color:#241B08}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding:6px 9px}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}

.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:13px;cursor:pointer;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:4px 11px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.scroller{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tr.more-row:hover{background:none}
tr.more-row td{padding:4px 12px 14px}
.co{font-weight:600;white-space:nowrap}
.dt{color:var(--ink3);font-size:12.5px;white-space:nowrap}
.geo{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:2px 8px;border-radius:99px;white-space:nowrap}
/* One class per priority rank, not per named tier: how many there are is
   whatever priority_locations has (see geo()). Five are coloured; a sixth
   still renders, just uncoloured, which beats inventing shades nobody can
   tell apart. */
.geo.pri0{background:var(--pri-0-soft);color:var(--pri-0)}
.geo.pri1{background:var(--pri-1-soft);color:var(--pri-1)}
.geo.pri2{background:var(--pri-2-soft);color:var(--pri-2)}
.geo.pri3{background:var(--pri-3-soft);color:var(--pri-3)}
.geo.pri4{background:var(--pri-4-soft);color:var(--pri-4)}
.key{display:flex;gap:15px;flex-wrap:wrap;align-items:center;font-size:12.5px;
  color:var(--ink3);padding:0 0 11px}
/* Pushes the run stamp to the trailing edge on a wide row, but it's the
   last flex item either way, so a wrapped narrow layout just drops it onto
   its own line instead of stranding it mid-row. */
.key-run{margin-left:auto}
/* Sort lives in this quiet row (see leadsTab/appsTab), not the primary
   toolbar - strips the bordered-control look .sortsel has up there down to
   something that reads as part of the same muted line as the run stamp
   and geo legend, while staying a real <select> (native arrow, full
   keyboard/click target) rather than something disguised as plain text. */
.key .sortwrap{gap:5px}
.key .sort-label{font-weight:400}
.key select.sortsel{background:none;border:1px solid transparent;color:var(--ink3);
  font-size:12.5px;padding:1px 3px;min-width:0}
.key select.sortsel:hover,.key select.sortsel:focus-visible{border-color:var(--line)}

/* "When did this search last run" - see runStampHtml(). Its whole job is to
   distinguish a genuine zero-result day from a search that quietly stopped
   firing, so the stale/error states have to read as warnings, not as more
   grey metadata. */
.runstamp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.runstamp .rdot{width:6px;height:6px;border-radius:50%;flex:none;background:var(--good)}
.runstamp.none{color:var(--ink3)}
.runstamp.stale{color:var(--warn);font-weight:500}
.runstamp.stale .rdot{background:var(--warn)}
.runstamp.error{color:var(--crit);font-weight:500}
.runstamp.error .rdot{background:var(--crit)}
.legend-run{margin-left:auto;padding-left:12px}
.empty-warn{margin-top:10px;color:var(--warn);font-size:13px}
.key i{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}

/* Detail/Grid is "how the data is displayed" - kept separate from and to
   the right of the data-scoping controls (search/filter/sort), which read
   left-to-right as one group. It claims the toolbar row's trailing free
   space itself, so whatever precedes it (with or without a sort control)
   just flows normally. */
.viewsw{display:flex;gap:2px;margin-left:auto;background:var(--surface2);padding:3px;border-radius:8px}
.vbtn{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink2);padding:5px 12px;border-radius:6px;cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.vbtn:hover{color:var(--ink)}

/* Sort sits with search/filter - it scopes which rows show and in what
   order, the same job as those controls, not the view switcher's job of
   how a row renders once selected. */
.sortwrap{display:flex;align-items:center;gap:7px}
.sort-label{font-size:12.5px;font-weight:600;color:var(--ink3)}
.sortsel{width:auto;min-width:150px}

/* Dense grid: the same records as one wide, fully-editable table -
   maximum information density, everything visible without a click. */
.grid-wrap{overflow-x:auto}
.grid-wrap a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line)}
.grid-wrap a:hover{border-bottom-color:var(--accent)}
.loc{color:var(--ink2);font-size:13px;max-width:200px}
.loc-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .geo{display:inline-block;margin-top:3px}
td.rc{max-width:260px}
td.rc a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.cc{max-width:170px;overflow:hidden;text-overflow:ellipsis}
td:first-child{border-left:3px solid transparent}
tr.pri0 td:first-child{border-left-color:var(--pri-0)}
tr.pri1 td:first-child{border-left-color:var(--pri-1)}
tr.pri2 td:first-child{border-left-color:var(--pri-2)}
tr.pri3 td:first-child{border-left-color:var(--pri-3)}
tr.pri4 td:first-child{border-left-color:var(--pri-4)}
td select{padding:5px 7px;font-size:13px;min-width:112px}
td input[type=text],td input[type=date]{font-size:13px;min-width:104px}
td textarea{font-size:13px;min-height:32px;min-width:130px}
.grid-wrap tbody tr[data-expand]{cursor:pointer}
.grid-wrap tbody tr.gr-sel{background:var(--accent-soft)}
.grid-wrap tbody tr.gr-sel:hover{background:var(--accent-soft)}
.exp-ind{color:var(--ink3);font-size:12.5px;white-space:nowrap}

/* Master-detail: a compact list on the left, the full record on the right -
   no expand/collapse, every field is one click away. Used by both the
   per-track leads tabs and Applications. */
.md{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.md-list{width:348px;flex:0 0 348px;border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;max-height:min(720px,calc(100vh - 260px))}
.md-row{padding:12px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent;
  cursor:pointer}
.md-row:last-child{border-bottom:0}
.md-row:hover{background:var(--surface2)}
.md-row.sel{background:var(--accent-soft)}
.md-row.sel:hover{background:var(--accent-soft)}
.md-row.pri0{border-left-color:var(--pri-0)}
.md-row.pri1{border-left-color:var(--pri-1)}
.md-row.pri2{border-left-color:var(--pri-2)}
.md-row.pri3{border-left-color:var(--pri-3)}
.md-row.pri4{border-left-color:var(--pri-4)}
.md-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.md-row-top .co{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.md-row-top .pill{flex:0 0 auto}
.md-row-ttl{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.md-row-loc{font-size:11.5px;color:var(--ink3);margin-top:7px;display:flex;align-items:baseline}
.md-row-loc .geo{flex:0 0 auto;margin-left:6px;padding:1px 7px}
.md-row-place{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-row-found{flex:0 0 auto;margin-left:auto;padding-left:10px;white-space:nowrap}
.md-detail{flex:1;min-width:0;padding:22px 28px;overflow-y:auto;
  max-height:min(720px,calc(100vh - 260px))}
.md-empty{padding:70px 20px;text-align:center;color:var(--ink3)}
.dh-track{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.dh-head h1{font-size:21px;margin-top:6px}
.dh-sub{font-size:14.5px;color:var(--ink2);margin-top:6px}
.dh-meta{font-size:12.5px;color:var(--ink3);margin-top:10px}
.dh-meta a{color:var(--accent)}
.dh-fit{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.5}

/* The application header (see appDetailHtml) is the lead header's layout
   built out of inputs, because an application is hand-maintainable in a way
   a lead isn't. `.dh-in` strips a field back to the text it stands in for
   and only draws its box on hover or focus, so the header reads as a heading
   until you go to change it. The negative margin cancels the padding the box
   needs, keeping the text on the same left edge as `.dh-track` above it.
   Selectors are `input.dh-*` deliberately: the shared input rule up top is
   an attribute selector, so a bare class would lose to it. */
.dh-app-top{display:flex;gap:10px;align-items:flex-start}
.dh-app-fields{flex:1;min-width:0}
.dh-app-top .icon-btn{flex:0 0 auto;margin-top:2px}
/* -8px, not -7px: the text inside sits past the 1px transparent border as
   well as the 7px padding, and it's the text that has to line up with the
   track line and the status row below. */
input.dh-in{width:calc(100% + 8px);border:1px solid transparent;background:none;color:var(--ink);
  border-radius:7px;padding:3px 7px;margin-left:-8px}
input.dh-in:hover,input.dh-in:focus{border-color:var(--line);background:var(--surface)}
input.dh-in::placeholder{color:var(--ink3)}
input.dh-h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;
  font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
input.dh-sub-in{font-size:14.5px;color:var(--ink2);margin-top:3px}
.dh-app-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:7px}
/* Width comes from the `size` attribute appDetailHtml sets from the value,
   so the field hugs its text like the lead header's plain location does. */
input.dh-loc-in{width:auto;max-width:calc(100% + 8px);font-size:12.5px;color:var(--ink3)}
.dh-sep{color:var(--ink3)}
.dh-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.dh-status select{width:auto;min-width:150px}
.dh-status input[type=date]{width:auto}
.dh-dates{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.dh-notes{margin-top:22px}
.icon-btn{appearance:none;flex:none;border:1px solid transparent;border-radius:8px;
  background:none;cursor:pointer;padding:9px;display:inline-flex;color:var(--ink3)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn.danger{color:var(--crit)}
.icon-btn.danger:hover{background:var(--surface2);border-color:var(--crit)}
.mf-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.facts-card{margin-top:22px;padding:18px 20px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.facts-card .more-grid{padding:0}
@media (max-width:900px){
  .md{flex-direction:column}
  .md-list{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line);max-height:280px}
  .md-detail{max-height:none}
}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  border:1px solid transparent;white-space:nowrap}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--surface2);color:var(--ink2)}
.pill.go{background:var(--surface2);color:var(--good);border-color:var(--good)}
.pill.no{background:none;color:var(--ink3);border-color:var(--line)}
.pill.hot{background:var(--surface2);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:none;color:var(--crit);border-color:var(--crit)}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));margin-bottom:20px}
.tile{padding:16px 17px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tile .v{font-family:"Bricolage Grotesque",sans-serif;font-size:31px;font-weight:700;line-height:1.15;margin-top:7px;letter-spacing:-.03em}
.tile .f{font-size:12.5px;color:var(--ink2);margin-top:3px}
.tile.hi .v{color:var(--accent)}

.bars{display:flex;flex-direction:column;gap:13px}
.bar h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;
  align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:7px}
.bar h3 span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);font-weight:400}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--ink2)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

.sec{margin:26px 0 11px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-size:17px;font-weight:700}
.sec p{margin:0;font-size:13px;color:var(--ink3)}

.empty{padding:44px 22px;text-align:center;color:var(--ink3)}
.empty strong{display:block;color:var(--ink2);font-weight:600;margin-bottom:5px;font-size:15px}

.more-grid{display:grid;gap:14px 18px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.mf label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;font-weight:600}
.mf-labelrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mf-labelrow label{margin-bottom:0}
.mf-open{font-size:11px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap;margin-bottom:4px}
.mf-open:hover{text-decoration:underline}
.note{font-size:12.5px;color:var(--ink3);padding:14px 0 0;line-height:1.6}
@media (max-width:900px){
  .wrap{padding:0 13px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#gate{position:fixed;inset:0;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .card{padding:26px 30px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
#gate h1{font-size:19px}

<script>
// Applied before body paint so a stored theme choice (see #themeToggle's
// click handler in the main script) doesn't flash the OS-default theme
// first. Absent/invalid values fall through to prefers-color-scheme.
try{
  var t0=localStorage.getItem("bjs.theme");
  if(t0==="light"||t0==="dark")document.documentElement.setAttribute("data-theme",t0);
}catch(e){}
</script>
</head>
<body>

<div id="gate">

<div id="app" class="hidden">

    <main id="panel"></main>

<!--
  Asks for the date a status change actually happened (or is scheduled
  for) instead of silently stamping today - see the change listener's
  stage-date interception and openStageDateModal()/confirmStageDate() in
  the script below. Only ever opened for an application's status select,
  moving into a stage whose history column is still blank. The title text
  is set from JS, not here - it depends on which stage, see STAGE_SCHEDULED.
-->

  <div class="card modal-card">
    <h3 id="stageDateTitle">When did this happen?</h3>

    </div>

<!--
  local-config.js is gitignored - never committed, same as private/ data
  elsewhere in this repo. It's how *this* deployment's own API URL gets in
  without hardcoding a personal URL into the tracked template that other
  installers fork. Doesn't exist? The browser just 404s this one request
  and moves on - see local-config.example.js for the file to create.
-->
<script src="local-config.js"></script>
<script>
(function(){
"use strict";

// Theme toggle: an explicit choice persists in localStorage ("bjs.theme")
// and is applied early by the small script in <head> (before this one
// runs) so there's no flash of the OS-default theme on load. No stored
// choice falls back to prefers-color-scheme; clicking the toggle always
// sets an explicit choice from then on, in either direction.
function effectiveTheme(){
  var explicit=document.documentElement.getAttribute("data-theme");
  if(explicit==="light"||explicit==="dark")return explicit;
  return (window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
}
function paintThemeToggle(){
  var btn=document.getElementById("themeToggle");
  if(!btn)return;
  var next=effectiveTheme()==="dark"?"light":"dark";
  btn.textContent=next==="dark"?"🌙":"☀️";
  btn.setAttribute("aria-label","Switch to "+next+" theme");
  btn.title=btn.getAttribute("aria-label");
}
function toggleTheme(){
  var next=effectiveTheme()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("bjs.theme",next);}catch(e){}
  paintThemeToggle();
}
paintThemeToggle();

var LEAD_STATUS=["New","Reviewing","Applied","Not a fit"];
// "To Apply" is a posting parked in this tab before applying to it - worth
// tracking (notes, comp, link, next action) but not sent yet, so it has no
// applied date until it moves to "Applied". Switching a row to it clears
// dateApplied server-side, and switching to "Applied" stamps it - see
// api.js's handleSetApplicationStatus.
var APP_STATUS=["To Apply","Applied","Recruiter Screen","Tech Screen","Onsite / Loop","Offer","Rejected","Withdrawn"];
var ACTIVE=["Recruiter Screen","Tech Screen","Onsite / Loop"];
// Primitive shapes rather than one hand-authored path - easier to eyeball
// as an actual trash can. stroke="currentColor" so .icon-btn's CSS color
// (see .icon-btn.danger) is what colors it, not a value baked in here.
var TRASH_ICON='<svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" '+
  'stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
  '<path d="M3 4.5h10"/><path d="M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5"/>'+
  '<path d="M4.5 4.5 5 13a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1l.5-8.5"/>'+
  '<path d="M6.7 7v4M9.3 7v4"/></svg>';
// Populated from state.tracks on boot (see buildTracks/applyConfig below) -
// not baked in, so this same deployed code serves any installer's tracks.
var TRACKS={};

// Guarded because reading localStorage *throws* where storage is disabled
// (a data: URL, a browser set to block site data) rather than returning null,
// and an exception here would take the whole script down before the gate ever
// rendered. Signing in still works in that state; it just won't be remembered.
var TOKEN="",NAME="";
try{
  TOKEN=localStorage.getItem("tracker_token")||"";
  // Display only, and remembered across sign-outs so the gate can prefill it.
  // The server decides whose data this actually is, from the token alone - the
  // header shows the name /api/data reports back, not this one.
  NAME=localStorage.getItem("tracker_name")||"";
}catch(e){}
// The API worker's origin (e.g. "https://job-search-tracker.you.workers.dev")
// - no trailing slash. This client is a separate deployable from the API
// (see ../server/), served from its own origin, so it has no same-origin
// API to fall back on.
//
// API_BASE comes from local-config.js (gitignored - see the <script> tag
// above), a deploy-time setting, never something a visitor types in - one
// deployed client always talks to one server. That file is never committed,
// so a fresh fork of this repo gets "" here until its deployer creates
// public/local-config.js (see local-config.example.js) with their
// ../server/ deploy's URL and redeploys - see the gate-init check below for
// what a visitor sees in the meantime.
var API_BASE=(typeof LOCAL_API_BASE!=="undefined"?LOCAL_API_BASE:"");
// Mirrors DEFAULT_SETTINGS in ../../server/src/api.js - the same
// intentional duplication as LEAD_STATUS/APP_STATUS above (no build step
// ties client and server together). Only used when the API omits a key;
// a configured deployment overwrites all of these.
function defaultSettings(){
  return {display_title:"Job Search Tracker",overview_label:"Overview",
    applications_label:"Applications",stale_run_hours:36,priority_locations:[]};
}
var state={updated:null,leads:[],applications:[],tracks:[],settings:defaultSettings()};

// Turns the API's tracks[] (rows: key/label/full_description/sort_order,
// plus the nested last_run from search_runs) into the {key:{...}} shape the
// rest of the page indexes by, in display order.
function buildTracks(list){
  var t={};
  (list||[]).slice().sort(function(a,b){
    return (a.sort_order-b.sort_order)||String(a.key).localeCompare(String(b.key));
  }).forEach(function(tr){
    t[tr.key]={label:tr.label,full:tr.full_description,run:tr.last_run||null};
  });
  return t;
}

// The whole tab bar as data, in render order: the two built-in tabs (which
// aren't tracks - nothing runs on a schedule to fill them) followed by one
// per configured track. Everything the tab bar and render() need is on
// these rows, so neither has to special-case a tab by hardcoded id: `kind`
// says which panel to draw, `label` comes from config either way. Adding a
// track to the DB adds a tab; renaming one renames it.
function buildTabs(){
  var s=state.settings||{};
  var tabs=[
    {id:"dashboard",kind:"overview",label:s.overview_label||"Overview",n:null},
    {id:"applications",kind:"applications",label:s.applications_label||"Applications",
     n:state.applications.length},
  ];
  Object.keys(TRACKS).forEach(function(k){
    tabs.push({id:k,kind:"track",label:TRACKS[k].label,
      // The tab badge is a "what hasn't been triaged yet" count, so it only
      // counts New leads - not the whole track (Reviewing/Not a fit are
      // things you've already looked at, and Applied leads have moved to
      // the Applications tab entirely, see setLeadStatus()).
      n:state.leads.filter(function(l){return l.search===k&&l.status==="New";}).length});
  });
  return tabs;
}

// Applies state.tracks/state.settings (from /api/data) to TRACKS and the
// header, replacing the "Brenna's Job Search" / fixed-track defaults.
function applyConfig(){
  TRACKS=buildTracks(state.tracks);
  var title=(state.settings&&state.settings.display_title)||"Job Search Tracker";
  document.title=title;
  var titleEl=document.getElementById("appTitle"); if(titleEl)titleEl.textContent=title;
  var n=state.tracks.length;
  var subEl=document.getElementById("appSub");
  // A brand-new deployment has no tracks until setup posts its config, and
  // "across 0 tracked searches" reads like a bug rather than a first run.
  if(subEl)subEl.textContent=n
    ? "Verified openings across "+n+" tracked search"+(n===1?"":"es")+
      ", refreshed daily. Edit anything — it saves for every device."
    : "No tracked searches configured yet — run the job-search-setup skill to add one.";
}
var ui={tab:"dashboard",q:"",filter:"All",selected:{},expanded:{},view:"detail",leadSort:"priority",appSort:"applied-desc"};

// Fields shown in leads' and applications' facts cards. Facts about the
// opportunity itself (stable once entered - comp doesn't change because
// you looked at it again yesterday) and is all a lead shows. "link" is
// omitted from ROLE_FIELDS for leads - a lead already has its own url
// (the header link points at it), so a second link input here would just
// duplicate it; applications get it via APP_ROLE_FIELDS instead, since a
// manually-added application has no posting URL to fall back on. The
// application header links this field too (see appDetailHtml), but the input
// has to stay: it's the only place the URL can be typed, and Grid view's
// expanded row shows these cards with no header above them.
//
// There used to be a third field group here - lastContact/nextAction/
// nextActionDate, a manually-typed reminder shown in its own "Follow-up"
// facts card and surfaced on the Overview as "What's next". Removed: once
// the stage-date modal (see openStageDateModal) asks "when is this
// scheduled?" at the moment a status actually changes, a hand-typed
// reminder about the same upcoming stage is a second, easily-stale copy
// of the same fact - the screenshot that prompted this showed exactly
// that drift (a stale "Recruiter screen · 9/3" row after the application
// had already moved on to Tech Screen). The DB columns still exist
// (nothing reads or writes them now) rather than being dropped - no
// upside to a migration for columns nothing points at.
var ROLE_FIELDS=[
  ["referral","Referral"],
  ["comp","Comp range"],
  ["team","Team / product"],
  ["setup","Work setup"]
];
var APP_ROLE_FIELDS=ROLE_FIELDS.concat([["link","Link"]]);

// One date per APP_STATUS pipeline stage an application has reached (see
// migrations/0001_schema.sql) - "Applied" isn't here,
// it already has dateApplied. commit() auto-stamps the matching entry with
// today's date the first time status moves to it (only if not already
// set), but every field here stays a normal editable date input - same
// pattern as any other field - so a wrong or skipped-stage date can always
// be fixed or backfilled by hand.
var STAGE_DATE_FIELDS=[
  ["Recruiter Screen","dateRecruiterScreen"],
  ["Tech Screen","dateTechScreen"],
  ["Onsite / Loop","dateOnsite"],
  ["Offer","dateOffer"],
  ["Rejected","dateRejected"],
  ["Withdrawn","dateWithdrawn"]
];
// [column,label] form, "Applied" first - the order the Stage history table
// (see stageHistoryHtml) renders in, and the source list for it.
var STAGE_HISTORY_FIELDS=[["dateApplied","Applied"]].concat(
  STAGE_DATE_FIELDS.map(function(s){return [s[1],s[0]];}));
// status -> its history column, mirrors server/src/api.js's STAGE_DATE_MAP -
// same intentional client/server duplication as APP_STATUS itself. Used to
// decide whether picking a status from the dropdown needs to ask for a date
// first (see the change listener's stage-date interception below).
var APP_STAGE_DATE_MAP={"Applied":"dateApplied"};
STAGE_DATE_FIELDS.forEach(function(s){APP_STAGE_DATE_MAP[s[0]]=s[1];});

// A hand-typed link field is still just text, so only http(s) becomes a
// real anchor. A bare "acme.com/jobs/1" is common enough to be worth
// accepting (https:// assumed); anything else - javascript:, data:, a note
// to self - gets no link rather than an href built from whatever was typed.
// Returns "" when there is nothing safe to open.
function safeUrl(v){
  var t=String(v==null?"":v).trim();
  if(!t)return "";
  if(/^https?:\/\//i.test(t))return t;
  if(/^[\w.-]+\.[a-z]{2,}([\/?#]|$)/i.test(t))return "https://"+t;
  return "";
}

function factsGridHtml(item,fields,isApp){
  var appAttr=isApp?' data-app="1"':'';
  return '<div class="more-grid">'+fields.map(function(f){
    var key=f[0],label=f[1],type=f[2]||"text";
    var val=item[key]||"";
    var input=type==="date"
      ?'<input type="date" data-id="'+item.id+'" data-field="'+key+'"'+appAttr+' value="'+esc(val)+'">'
      :'<input type="text" data-id="'+item.id+'" data-field="'+key+'"'+appAttr+' value="'+esc(val)+'" placeholder="'+esc(label)+'">';
    // The link field stays an editable input - that is how a posting URL
    // gets entered or corrected - so the way to open it is an anchor beside
    // the label rather than turning the field itself into a link.
    var href=key==="link"?safeUrl(val):"";
    var lab='<label>'+esc(label)+'</label>';
    if(href)lab='<div class="mf-labelrow">'+lab+
      '<a class="mf-open" href="'+esc(href)+'" target="_blank" rel="noopener">Open &#8599;</a></div>';
    return '<div class="mf">'+lab+input+'</div>';
  }).join("")+'</div>';
}

// A row per pipeline stage (Applied first, then STAGE_HISTORY_FIELDS' own
// order) instead of factsGridHtml's grid of same-size boxes - a history is
// a sequence, and a list read top-to-bottom says so more directly than a
// wrapping grid does. Editing works the same way as any other field
// (commit() via the change/focusout listeners); this only changes the
// layout, not what the inputs do.
function stageHistoryHtml(item){
  return '<div class="stage-hist"><table><tbody>'+
    STAGE_HISTORY_FIELDS.map(function(f){
      var key=f[0],label=f[1],val=item[key]||"";
      return '<tr><th>'+esc(label)+'</th><td><input type="date" data-id="'+item.id+
        '" data-field="'+key+'" data-app="1" value="'+esc(val)+'"></td></tr>';
    }).join("")+
  '</tbody></table></div>';
}

// Renders the facts boxes (role details, then - for an application - stage
// history) for either a lead or an application. `compact` drops the first
// box's default top margin - used in Grid view's expanded row, which is
// already padded by its containing cell and doesn't want the extra gap
// Detail view does.
function factsCardsHtml(item,isApp,compact){
  var roleFields=isApp?APP_ROLE_FIELDS:ROLE_FIELDS;
  var h='<div class="facts-card"'+(compact?' style="margin-top:0"':'')+'><div class="mf-label">Role details</div>'+
      factsGridHtml(item,roleFields,isApp)+'</div>';
  if(isApp)h+='<div class="facts-card"><div class="mf-label">Stage history</div>'+
      stageHistoryHtml(item)+'</div>';
  return h;
}
try{var s=localStorage.getItem("bjs.tab");if(s)ui.tab=s;}catch(e){}
try{var vw0=localStorage.getItem("bjs.view");if(vw0)ui.view=vw0;}catch(e){}
try{var ls0=localStorage.getItem("bjs.leadSort");if(ls0)ui.leadSort=ls0;}catch(e){}
try{var as0=localStorage.getItem("bjs.appSort");if(as0)ui.appSort=as0;}catch(e){}

function viewSwitchHtml(){
  return '<div class="viewsw">'+
    '<button class="vbtn" data-view="detail" aria-pressed="'+(ui.view!=="grid")+'">Detail</button>'+
    '<button class="vbtn" data-view="grid" aria-pressed="'+(ui.view==="grid")+'">Grid</button>'+
  '</div>';
}

// Sort controls: one <select> drives both Grid and Detail, since both
// render from the same sorted array (see leadsTab/appsTab) - there's no
// separate "grid order" and "detail order" to keep in sync.
//
// "priority" is the longstanding leads default - not-a-fit sinks to the
// bottom regardless of location tier (it's been screened out, so it
// shouldn't compete with active leads for the top-of-list spots the geo
// ranking is trying to surface), then geo tier, then newest found as the
// tiebreak. The flat options exist for when you're hunting for something
// specific by name/place/date rather than triaging what's new.
var LEAD_SORTS=[
  ["priority","Priority"],
  ["found-desc","Newest found"],
  ["found-asc","Oldest found"],
  ["location-asc","Location A-Z"],
  ["company-asc","Company A-Z"]
];
function leadComparator(sortKey){
  if(sortKey==="found-desc")return function(a,b){return String(b.found).localeCompare(String(a.found));};
  if(sortKey==="found-asc")return function(a,b){return String(a.found).localeCompare(String(b.found));};
  if(sortKey==="location-asc")return function(a,b){return String(a.location).localeCompare(String(b.location));};
  if(sortKey==="company-asc")return function(a,b){return String(a.company).localeCompare(String(b.company));};
  // Location first, then "Not a fit", then newest. The order of those two
  // keys used to be the other way round, and it produced a list that
  // contradicted the caption above it: a lead with no matching location rule
  // could sit at the very top, above several Remote (US) ones, purely because
  // it hadn't been rejected yet. Seen live as a "US - United States" posting
  // leading a tab whose header reads "Closest roles sorted first".
  //
  // It looked worse than it was - the offending lead really was last within
  // its own status group, but the leads above it were hidden because they
  // already have applications, so what remained read as nonsense. Either way
  // the sort is called Priority and the priority being sorted on is location,
  // so location is the key that belongs first.
  //
  // "Not a fit" still sinks, just within its tier rather than past every
  // tier. A rejected Remote (US) role now sits below the live Remote (US)
  // ones and above everything further away, which is what "closest first"
  // says on the tin.
  return function(a,b){
    var d=rank(a)-rank(b); if(d)return d;
    var na=a.status==="Not a fit"?1:0, nb=b.status==="Not a fit"?1:0;
    if(na!==nb)return na-nb;
    return String(b.found).localeCompare(String(a.found));
  };
}

// Applications have no location or "found" date to sort by - just when you
// applied and who to. The API returns them oldest-first (ORDER BY id, no
// explicit sort was ever applied client-side), so defaulting this control to
// "Newest applied" is a small deliberate change, not a no-op - it's the more
// useful default for a tab you open to see what's freshest.
var APP_SORTS=[
  ["applied-desc","Newest applied"],
  ["applied-asc","Oldest applied"],
  ["location-asc","Location A-Z"],
  ["company-asc","Company A-Z"]
];
function appComparator(sortKey){
  if(sortKey==="company-asc")return function(a,b){return String(a.company).localeCompare(String(b.company));};
  if(sortKey==="location-asc")return function(a,b){
    // Unlike a lead, an application can have no location at all - one added
    // by hand starts blank. An empty string sorts first, which would put the
    // rows saying nothing about where they are at the top of the sort that
    // asks exactly that, so they sink instead (same shape as the "To Apply"
    // float below).
    var ea=a.location?0:1, eb=b.location?0:1;
    if(ea!==eb)return ea-eb;
    return String(a.location).localeCompare(String(b.location));
  };
  var byDate=sortKey==="applied-asc"
    ?function(a,b){return String(a.dateApplied).localeCompare(String(b.dateApplied));}
    :function(a,b){return String(b.dateApplied).localeCompare(String(a.dateApplied));};
  // "To Apply" rows have no applied date to sort by, so either date sort
  // would clump them at one end on an empty string - last, under the
  // default, which is the wrong place for the only rows still owing an
  // application. Float them to the top instead (same shape as the leads
  // comparator sinking "Not a fit"). Company A-Z above is left alone: an
  // explicit alphabetical sort should be exactly alphabetical.
  return function(a,b){
    var ta=a.status==="To Apply"?0:1, tb=b.status==="To Apply"?0:1;
    if(ta!==tb)return ta-tb;
    return byDate(a,b);
  };
}

function sortSelectHtml(kind,id){
  var opts=kind==="leads"?LEAD_SORTS:APP_SORTS;
  var current=(kind==="leads"?ui.leadSort:ui.appSort)||opts[0][0];
  return '<select class="sortsel" id="'+esc(id)+'" data-sort="'+kind+'">'+
    opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===current?' selected':'')+'>'+esc(o[1])+'</option>';}).join("")+
  '</select>';
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function daysSince(d){if(!d)return null;var t=Date.parse(d);if(isNaN(t))return null;
  return Math.max(0,Math.floor((Date.now()-t)/86400000));}

function hoursSince(d){if(!d)return null;var t=Date.parse(d);if(isNaN(t))return null;
  return Math.max(0,(Date.now()-t)/3600000);}

function today(){return new Date().toISOString().slice(0,10);}

// ---- Scheduled-run status (see server migrations/0001_schema.sql)
//
// Each track carries the last run its scheduled search recorded. This is the
// only thing on the page that can tell "the search ran and genuinely found
// nothing" apart from "the search stopped running" - every other signal
// (lead counts, the tabs, meta.updated) looks identical in both cases.

// "ok" | "stale" | "error" | "never". "never" is deliberately not treated as
// a problem: it's the honest state of a freshly configured track that hasn't
// hit its first scheduled run yet, and flagging that would mean every new
// install opens covered in warnings.
function runState(run){
  if(!run||!run.at)return "never";
  if(run.status==="error")return "error";
  var h=hoursSince(run.at);
  var limit=Number(state.settings&&state.settings.stale_run_hours)||36;
  return (h===null||h>limit)?"stale":"ok";
}

// Coarse on purpose - the useful distinctions are "today", "yesterday", and
// "long enough ago that something is wrong", not exact minutes.
function relWhen(iso){
  var h=hoursSince(iso);
  if(h===null)return "";
  if(h<1)return "just now";
  if(h<24)return Math.round(h)+"h ago";
  var d=Math.floor(h/24);
  return d===1?"yesterday":d+"d ago";
}

// What the run did, in one clause. Counts come from the run record itself
// rather than being recomputed from leads[], so a day that added nothing
// still reads as a real result ("found nothing new") instead of a blank.
function runSummary(run){
  if(!run||!run.at)return "";
  if(run.status==="error")return run.note||"the run reported an error";
  var bits=[];
  if(run.leads_added)bits.push(run.leads_added+" new");
  if(run.screened_added)bits.push(run.screened_added+" screened out");
  // The run record still counts these ("2 postings came down today") even
  // though nothing on a lead marks it - the rows themselves were deleted.
  if(run.delisted)bits.push(run.delisted+" taken down");
  return bits.length?bits.join(", "):"found nothing new";
}

// The one-line "when did this search last run" stamp shown above a track's
// list and in the Overview panel.
function runStampHtml(key){
  var tr=TRACKS[key]; if(!tr)return "";
  var run=tr.run, st=runState(run);
  if(st==="never"){
    return '<span class="runstamp none" title="This track has no recorded run yet - '+
      'its first scheduled search will fill this in">No run recorded yet</span>';
  }
  var when=relWhen(run.at);
  var title="Last run "+esc(run.at)+(run.on?" (local date "+esc(run.on)+")":"");
  return '<span class="runstamp '+st+'" title="'+title+'">'+
    '<i class="rdot"></i>Ran '+esc(when)+
    (run.on?' <span class="mono">'+esc(run.on)+'</span>':'')+
    ' &middot; '+esc(runSummary(run))+'</span>';
}

// Evaluates state.settings.priority_locations (see the server's
// migrations/0001_schema.sql) - an ordered list of {tier, label, anyOf,
// allOf} rules, first match wins. Was a hard-coded Seattle/Portland lookup;
// now it's whatever an installer's config says, with the search-substring
// semantics unchanged (anyOf: at least one substring present; allOf,
// optional: every substring present).
function geo(location){
  var loc=String(location||"").toLowerCase();
  var rules=(state.settings&&state.settings.priority_locations)||[];
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    if(r.allOf&&!r.allOf.every(function(s){return loc.indexOf(s)>=0;}))continue;
    if(r.anyOf&&!r.anyOf.some(function(s){return loc.indexOf(s)>=0;}))continue;
    return {p:priClass(i),label:r.label,i:i};
  }
  return null;
}
// Priority is the position of the matching rule in priority_locations, not
// its `tier` string. That is what lets someone define two rankings or five:
// the list is already ordered, so ordering it again by tier name was both
// redundant and capped at the two names the CSS happened to know. `tier` is
// still accepted in stored config and still ignored here.
function priClass(i){return i<5?"pri"+i:"";}
function rank(l){var g=geo(l.location);return g?g.i:999;}

function setSaved(msg,ok){
  var d=document.getElementById("savedot"),t=document.getElementById("savetext");
  if(!d)return; d.className="dot"+(ok===false?" off":ok==="bad"?" bad":"");
  t.textContent=msg;
}

// Exchanges name+password for a session token, which is what every later
// request carries - the password is sent once and never stored. The name is
// remembered (it isn't a secret) so returning to a signed-out browser only
// means typing the password.
function submitToken(){
  if(!API_BASE){
    document.getElementById("gateError").textContent="This deployment has no API URL configured - see public/local-config.example.js.";
    return;
  }
  var name=document.getElementById("nameInput").value.trim();
  var password=document.getElementById("passwordInput").value;
  if(!name||!password){
    document.getElementById("gateError").textContent="Enter your name and password.";
    return;
  }
  document.getElementById("gateError").textContent="Signing in...";
  fetch(API_BASE+"/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:name,password:password,label:"browser"})
  }).then(function(res){
    return res.json().then(function(body){return {status:res.status,body:body};});
  }).then(function(r){
    if(r.status!==200||!r.body.token){
      document.getElementById("gateError").textContent="That name and password don't match.";
      return;
    }
    TOKEN=r.body.token;
    NAME=r.body.user&&r.body.user.name||name;
    try{localStorage.setItem("tracker_token",TOKEN);localStorage.setItem("tracker_name",NAME);}catch(e){}
    document.getElementById("passwordInput").value="";
    document.getElementById("gateError").textContent="";
    boot();
  }).catch(function(err){
    document.getElementById("gateError").textContent="Couldn't sign in: "+err.message;
  });
}

// Drops this browser's credential and everything remembered about whose page
// this was. The view preferences go too: they're per-person choices (which
// track tab, which sort), and leaving them behind would drop the next person
// to sign in on a tab that isn't theirs.
function forgetSession(message){
  TOKEN="";
  try{
    localStorage.removeItem("tracker_token");
    localStorage.removeItem("bjs.tab");
    localStorage.removeItem("bjs.view");
    localStorage.removeItem("bjs.leadSort");
    localStorage.removeItem("bjs.appSort");
  }catch(e){}
  // The in-memory copy too, not just the stored one: signing in as someone
  // else doesn't reload the page, so without this the next person lands on
  // whatever tab and sort the last one left behind - and it gets re-saved
  // under their session, which is how a cleared preference comes back.
  ui.tab="dashboard";ui.q="";ui.filter="All";ui.selected={};ui.expanded={};
  ui.view="detail";ui.leadSort="priority";ui.appSort="applied-desc";
  document.getElementById("gate").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("gateError").textContent=message||"";
  var pw=document.getElementById("passwordInput");
  if(pw){pw.value="";pw.focus();}
}

// Revokes the token server-side as well, so signing out of a shared or
// borrowed browser actually invalidates it rather than just forgetting it
// here. The other sessions this person holds - notably the scheduled
// search's - are untouched.
function logout(){
  var token=TOKEN;
  forgetSession("");
  if(!token||!API_BASE)return;
  // Say so if the revoke didn't land. This browser has already forgotten the
  // token either way - that part must not depend on the network - but the
  // token is still live on the server, which matters on a shared machine.
  fetch(API_BASE+"/api/logout",{method:"POST",headers:{"Authorization":"Bearer "+token}}).then(function(res){
    if(!res.ok)throw new Error("status "+res.status);
  }).catch(function(){
    document.getElementById("gateError").textContent=
      "Signed out here, but couldn't reach the server to revoke this session.";
  });
}

function api(path,opts){
  var headers={"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};
  if(opts&&opts.headers){for(var k in opts.headers){headers[k]=opts.headers[k];}}
  var merged={};
  if(opts){for(var k2 in opts){merged[k2]=opts[k2];}}
  merged.headers=headers;
  return fetch(API_BASE+path,merged).then(function(res){
    if(res.status===401){
      // The token was revoked (logged out elsewhere) or never valid. Same
      // handling either way: forget it and ask for the password again.
      forgetSession("Your session has expired - sign in again.");
      throw new Error("unauthorized");
    }
    return res.json();
  });
}

function boot(){
  setSaved("Loading",false);
  api("/api/data").then(function(data){
    state=data;
    if(!state.leads)state.leads=[];
    if(!state.applications)state.applications=[];
    if(!Array.isArray(state.tracks))state.tracks=[];
    var d=defaultSettings();
    if(!state.settings)state.settings=d;
    else for(var sk in d){if(state.settings[sk]==null)state.settings[sk]=d[sk];}
    applyConfig();
    if(state.user&&state.user.name){
      NAME=state.user.name;
      try{localStorage.setItem("tracker_name",NAME);}catch(err2){}
    }
    document.getElementById("whoami").textContent=NAME?"Signed in as "+NAME:"";
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    setSaved("Saved",true);
    render();
  }).catch(function(err){
    var el=document.getElementById("gateError");
    if(el&&err.message!=="unauthorized")el.textContent="Couldn't load: "+err.message;
  });
}

function tabsHtml(){
  return buildTabs().map(function(x){
    // Only a track tab can carry a run warning, and only stale/error earn
    // one - see runState() on why "never ran" stays quiet.
    var warn="";
    if(x.kind==="track"){
      var st=runState(TRACKS[x.id]&&TRACKS[x.id].run);
      if(st==="stale"||st==="error"){
        warn='<i class="tabwarn '+st+'" title="'+
          (st==="error"?"The last scheduled run reported an error":
                        "This search hasn’t run recently")+'"></i>';
      }
    }
    return '<button class="tab" role="tab" data-tab="'+esc(x.id)+'" aria-selected="'+(ui.tab===x.id)+'">'+
      esc(x.label)+warn+(x.n!==null?'<span class="n">'+x.n+'</span>':'')+'</button>';
  }).join("");
}

function pillFor(st){
  var m={"New":"new","Reviewing":"hot","Applied":"go","Not a fit":"no",
         "To Apply":"new",
         "Recruiter Screen":"hot","Tech Screen":"hot","Onsite / Loop":"hot","Offer":"go",
         "Rejected":"bad","Withdrawn":"no"};
  return m[st]||"live";
}

function selectHtml(opts,val,attrs){
  var list=opts.slice();
  if(val&&list.indexOf(val)<0)list.push(val);
  return '<select '+attrs+'>'+list.map(function(o){
    return '<option'+(o===val?" selected":"")+'>'+esc(o)+'</option>';}).join("")+'</select>';
}

function dashboard(){
  var L=state.leads, A=state.applications;
  var fresh=L.filter(function(l){return l.status==="New";}).length;
  var active=A.filter(function(a){return ACTIVE.indexOf(a.status)>=0;}).length;
  var stale=A.filter(function(a){var d=daysSince(a.dateApplied);
    return a.status==="Applied"&&d!==null&&d>14;}).length;
  // "To Apply" rows sit in the Applications tab without having been applied
  // to, so they'd inflate an "Applied" count - split them out and show them
  // as their own line under the tile instead.
  var toApply=A.filter(function(a){return a.status==="To Apply";}).length;
  var appliedCount=A.length-toApply;
  var near=L.filter(function(l){var g=geo(l.location);
    return g&&g.i===0&&l.status!=="Not a fit"&&l.status!=="Applied";}).length;
  // The first rule is the top ranking by definition now, so this counts and
  // labels the same thing - it used to count every p-high rule but label only
  // the first, so with two of them the number and the heading disagreed.
  var topRule=(state.settings.priority_locations||[])[0];
  var topLabel=topRule?topRule.label:"Top locations";
  var trackCount=state.tracks.length;

  var h='<div class="tiles">'+
    '<div class="tile hi"><div class="k">Untriaged</div><div class="v mono">'+fresh+'</div><div class="f">leads marked New</div></div>'+
    '<div class="tile"><div class="k">'+esc(topLabel)+'</div><div class="v mono" style="color:var(--pri-0)">'+near+'</div><div class="f">still open</div></div>'+
    '<div class="tile"><div class="k">Tracked leads</div><div class="v mono">'+L.length+'</div><div class="f">across '+trackCount+' tracked search'+(trackCount===1?'':'es')+'</div></div>'+
    '<div class="tile"><div class="k">Applied</div><div class="v mono">'+appliedCount+'</div><div class="f">'+
      (toApply?'plus '+toApply+' still to apply':'in your Applications tab')+'</div></div>'+
    '<div class="tile"><div class="k">In conversation</div><div class="v mono">'+active+'</div><div class="f">screen or loop stage</div></div>'+
    '<div class="tile"><div class="k">Gone quiet</div><div class="v mono">'+stale+'</div><div class="f">applied 14+ days ago</div></div>'+
  '</div>';

  // Whether every scheduled search is still firing is the one thing the
  // lead counts above genuinely cannot show - a search that stopped running
  // and a search that found nothing produce the same unchanged numbers.
  var keys=Object.keys(TRACKS);
  var bad=keys.filter(function(k){var s=runState(TRACKS[k].run);return s==="stale"||s==="error";});
  var never=keys.filter(function(k){return runState(TRACKS[k].run)==="never";});
  var subline;
  if(!keys.length)subline="No tracks configured yet";
  else if(bad.length)subline=bad.length+" of "+keys.length+" haven’t reported a clean run recently";
  else if(never.length===keys.length)subline="Waiting on the first recorded run";
  else subline="All "+keys.length+" reporting on schedule";
  h+='<div class="sec"><h2>Daily searches</h2><p>'+esc(subline)+'</p></div>';

  // With no tracks there are no bars to draw, and the card would render as an
  // empty slab - which on a fresh install (where this is the expected state,
  // not an error) looks like something failed to load.
  if(!keys.length){
    h+='<div class="card empty"><strong>No searches set up yet</strong>'+
      'Run the job-search-setup skill to add a tracked search. Once one exists, '+
      'its daily run reports in here — including the days it finds nothing.</div>';
  }else{

  h+='<div class="card" style="padding:19px"><div class="bars">';
  keys.forEach(function(k){
    var rows=state.leads.filter(function(l){return l.search===k;});
    var byStatus=LEAD_STATUS.map(function(st){
      return {s:st,n:rows.filter(function(r){return r.status===st;}).length};});
    var tot=rows.length||1;
    var cols={"New":"var(--accent)","Reviewing":"var(--warn)","Applied":"var(--good)",
              "Not a fit":"var(--line)"};
    h+='<div class="bar"><h3>'+esc(TRACKS[k].label)+' <span>'+esc(TRACKS[k].full)+' &middot; '+rows.length+'</span></h3>'+
      '<div class="meter">'+byStatus.map(function(b){
        return b.n?'<i style="width:'+(b.n/tot*100)+'%;background:'+cols[b.s]+'"></i>':"";}).join("")+'</div>'+
      '<div class="legend">'+byStatus.filter(function(b){return b.n;}).map(function(b){
        return '<span><b style="background:'+cols[b.s]+'"></b>'+esc(b.s)+' '+b.n+'</span>';}).join("")+
      (rows.length?"":'<span style="color:var(--ink3)">No postings found yet</span>')+
      '<span class="legend-run">'+runStampHtml(k)+'</span></div></div>';
  });
  h+='</div></div>';
  }

  // Application pipeline: how far things get once you've actually applied,
  // not just where each one sits today. STAGE_DATE_FIELDS stamps a date the
  // first time an application reaches a stage and never clears it, so it
  // survives a later status change (an app rejected after Tech Screen still
  // shows it reached Tech Screen) - current `status` alone can't tell that
  // story, only where something landed.
  var appsApplied=A.filter(function(a){return a.status!=="To Apply";});
  h+='<div class="sec"><h2>Application pipeline</h2><p>'+
    (appliedCount?appliedCount+' applied &middot; '+active+' in active conversation':'Nothing applied yet')+
    '</p></div>';
  if(!appliedCount){
    h+='<div class="card empty"><strong>No applications yet</strong>'+
      (toApply
        ? 'You have '+toApply+' queued to apply in the Applications tab &mdash; the funnel fills in once you mark one Applied.'
        : 'Move a lead to Applied, or add one directly from the Applications tab, and its progress shows up here.')+
      '</div>';
  }else{
    var FUNNEL=[["Applied",appliedCount]].concat(STAGE_DATE_FIELDS.slice(0,4).map(function(s){
      return [s[0],appsApplied.filter(function(a){return a[s[1]];}).length];
    }));
    h+='<div class="card" style="padding:19px"><div class="bars">'+
      FUNNEL.map(function(r,i){
        var pct=Math.round(r[1]/appliedCount*100);
        var color=i===0?"var(--ink3)":(i===FUNNEL.length-1?"var(--good)":"var(--accent)");
        return '<div class="bar"><h3>'+esc(r[0])+' <span>'+r[1]+' &middot; '+pct+'%</span></h3>'+
          '<div class="meter"><i style="width:'+pct+'%;background:'+color+'"></i></div></div>';
      }).join("")+'</div>';

    // "Responded" counts a rejection as a response (it is one - just not a
    // forward one), so it's deliberately a different, larger number than
    // the funnel's own forward-progress stages. Withdrawn is excluded from
    // both halves of that count: it's Brenna's action, not the company's.
    var RESPONSE_FIELDS=["dateRecruiterScreen","dateTechScreen","dateOnsite","dateOffer","dateRejected"];
    var responded=appsApplied.filter(function(a){
      return RESPONSE_FIELDS.some(function(f){return a[f];});
    }).length;
    var respTimes=appsApplied.map(function(a){
      if(!a.dateApplied)return null;
      var d0=Date.parse(a.dateApplied); if(isNaN(d0))return null;
      var earliest=null;
      RESPONSE_FIELDS.forEach(function(f){
        if(!a[f])return;
        var d=Date.parse(a[f]); if(isNaN(d))return;
        if(earliest===null||d<earliest)earliest=d;
      });
      if(earliest===null)return null;
      var days=Math.round((earliest-d0)/86400000);
      return days>=0?days:null;
    }).filter(function(n){return n!==null;});
    var avgResp=respTimes.length?Math.round(respTimes.reduce(function(a,b){return a+b;},0)/respTimes.length):null;
    var offerNow=appsApplied.filter(function(a){return a.status==="Offer";}).length;
    var rejectedNow=appsApplied.filter(function(a){return a.status==="Rejected";}).length;
    var withdrawnNow=appsApplied.filter(function(a){return a.status==="Withdrawn";}).length;
    h+='<div class="legend" style="margin-top:15px;padding-top:14px;border-top:1px solid var(--line)">'+
      '<span><b style="background:var(--good)"></b>'+offerNow+' offer'+(offerNow===1?'':'s')+'</span>'+
      '<span><b style="background:var(--crit)"></b>'+rejectedNow+' rejected</span>'+
      '<span><b style="background:var(--ink3)"></b>'+withdrawnNow+' withdrawn</span>'+
      '<span class="legend-run">'+Math.round(responded/appliedCount*100)+'% responded'+
      (avgResp!==null?' &middot; avg '+avgResp+'d to first response':'')+'</span>'+
      '</div></div>';
  }

  h+='<div class="note">'+(trackCount
    ? 'Scheduled searches across your '+trackCount+' tracked search'+(trackCount===1?'':'es')+' add rows here every day.'
    : 'Once a tracked search is set up, its scheduled run adds rows here every day.')+
    ' Every posting is opened and confirmed live before it lands; nothing arrives from a search snippet alone.</div>';
  return h;
}

function leadsTab(key){
  // One reason a tracked lead isn't shown here: it's been marked "Applied"
  // and moved to the Applications tab (see setLeadStatus()). The row itself
  // stays in state.leads/the DB, which URL dedup needs. A lead whose posting
  // has been taken down isn't filtered out here because it isn't in
  // state.leads at all - the server deletes it when a search reports it dead
  // (see api.js's removeDelistedLead), so there's no dead-posting state left
  // for this function to know about.
  // `tracked` keeps the unfiltered set only so the empty state below can tell
  // a search that has never found anything from one whose finds have all been
  // applied to.
  var tracked=state.leads.filter(function(l){return l.search===key;});
  var all=tracked.filter(function(l){return l.status!=="Applied";});
  var q=ui.q.toLowerCase();
  var rows=all.filter(function(l){
    if(ui.filter!=="All"&&l.status!==ui.filter)return false;
    if(!q)return true;
    return (l.company+" "+l.title+" "+l.location).toLowerCase().indexOf(q)>=0;
  }).sort(leadComparator(ui.leadSort));
  // Numbered so the ranking is readable as a ranking - with more than two
  // tiers, colour alone stops saying which one outranks which.
  var geoKeyHtml=(state.settings.priority_locations||[]).map(function(r,i){
    var dot=i<5?"var(--pri-"+i+")":"var(--ink3)";
    return '<span><i style="background:'+dot+'"></i>'+(i+1)+'. '+esc(r.label)+'</span>';
  }).join("");
  var h='<div class="toolbar">'+
    '<div class="search"><input type="search" id="q" placeholder="Filter '+esc(TRACKS[key].label)+'&hellip;" value="'+esc(ui.q)+'"></div>'+
    '<div class="chips">'+["All"].concat(LEAD_STATUS.filter(function(s){return s!=="Applied";})).map(function(f){
      return '<button class="chip" data-filter="'+esc(f)+'" aria-pressed="'+(ui.filter===f)+'">'+esc(f)+'</button>';
    }).join("")+'</div>'+
    viewSwitchHtml()+'</div>'+
    // The controls people touch constantly (search, status, view mode)
    // stay full-weight above. Sort and this row's other contents are all
    // settings/context you glance at, not fiddle with per-visit, so they
    // share one quieter line instead of competing for the same attention.
    '<div class="key"><div class="sortwrap"><label class="sort-label" for="leadSort">Sort</label>'+sortSelectHtml("leads","leadSort")+'</div>'+
      geoKeyHtml+
      // Only true under the default sort - a flat sort by found/location/
      // company means proximity no longer decides the order, so the legend
      // shouldn't claim it does.
      (ui.leadSort==="priority"?'<span>Closest roles sorted first</span>':'')+
      '<span class="key-run">'+runStampHtml(key)+'</span></div>';

  if(!all.length){
    // An empty track has more than one story behind it, and they read very
    // differently. Whether anything is still tracked separates a search that
    // has turned up nothing from one whose finds have all been applied to;
    // the run record separates a real zero (the search ran this morning and
    // there was nothing) from a search that hasn't run in a week, which isn't
    // a result at all. A track whose postings have all been taken down reads
    // as the first of those - the rows were deleted, so nothing here can know
    // they ever existed.
    var st0=runState(TRACKS[key].run);
    var warn0=(st0==="stale"||st0==="error")
      ? '<div class="empty-warn">But this search hasn&rsquo;t reported a clean run recently &mdash; check the scheduled task before reading this as a genuine zero.</div>'
      : '';
    if(tracked.length){
      return h+'<div class="card empty"><strong>Nothing open right now</strong>'+
        'Everything this search is still tracking has been applied to &mdash; it&rsquo;s all in the Applications tab. '+
        'New postings land here as the daily run finds them.'+warn0+'</div>';
    }
    return h+'<div class="card empty"><strong>No postings yet</strong>The '+esc(TRACKS[key].label).toLowerCase()+
      ' search hasn&rsquo;t turned up a verified opening yet. An empty day is a real result &mdash; nothing gets padded in here.'+
      warn0+'</div>';
  }
  if(!rows.length) return h+'<div class="card empty"><strong>Nothing matches</strong>Try a different filter.</div>';

  if(ui.view==="grid"){
    h+=leadsGridHtml(rows,key);
    h+='<div class="note">Quick-scan columns only &mdash; referral, notes, team, setup, and the rest are in Detail view (click a row to open them). Edits save when you click away. '+rows.length+' of '+all.length+' shown.</div>';
    return h;
  }

  var sel=rows.filter(function(l){return String(l.id)===String(ui.selected[key]);})[0]||rows[0];
  ui.selected[key]=sel.id;

  var listHtml=rows.map(function(l){
    var g=geo(l.location);
    var cls="md-row"+(l.id===sel.id?" sel":"")+(g?" "+g.p:"");
    return '<div class="'+cls+'" data-select="'+l.id+'" data-scope="'+key+'">'+
      '<div class="md-row-top"><span class="co">'+esc(l.company)+'</span>'+
        '<span class="pill '+pillFor(l.status)+'">'+esc(l.status)+'</span></div>'+
      '<div class="md-row-ttl">'+esc(l.title)+'</div>'+
      '<div class="md-row-loc"><span class="md-row-place">'+esc(l.location)+'</span>'+
        (g?'<span class="geo '+g.p+'">'+esc(g.label)+'</span>':'')+
        '<span class="md-row-found" title="Date this listing was added">Found <span class="mono">'+esc(l.found)+'</span></span></div>'+
    '</div>';
  }).join("");

  h+='<div class="md"><div class="md-list">'+listHtml+'</div><div class="md-detail">'+leadDetailHtml(sel,key)+'</div></div>';
  h+='<div class="note">Status, notes, and details save when you click away from the field. '+rows.length+' of '+all.length+' shown.</div>';
  return h;
}

// The grid is for a fast scan without scrolling, so it shows a deliberately
// short list of columns - not the full field set (that's what Detail view
// is for, along with referral/notes/everything else cut from here to keep

var LEAD_GRID_FIELDS=[

];

  '</tr></thead><tbody>'+rows.map(function(l){
    var g=geo(l.location);
    var open=!!ui.expanded[l.id];
    // The row itself is the click target for expand/select (see the

    // it except an actual form control opens its Details and highlights
    // it, rather than requiring a precise click on a button.
    var cls=(g?[g.p]:[]).concat(String(ui.selected[trackKey])===String(l.id)?["gr-sel"]:[]).join(" ");
    var row='<tr data-expand="'+l.id+'" data-scope="'+trackKey+'"'+(cls?' class="'+cls+'"':'')+'>'+

      '<td>'+selectHtml(LEAD_STATUS,l.status,'data-id="'+l.id+'" data-field="status"')+'</td>'+
      LEAD_GRID_FIELDS.map(function(f){
        var key=f[0],val=l[key]||"";
        return '<td><input type="text" data-id="'+l.id+'" data-field="'+key+'" value="'+esc(val)+'"></td>';
      }).join("")+
      '<td class="dt mono">'+esc(l.found)+'</td>'+

function appsTab(){
  var A=state.applications.slice().sort(appComparator(ui.appSort));
  var h='<div class="toolbar"><button class="btn primary" id="addapp">Add application</button>'+
    '<span style="font-size:13px;color:var(--ink3)">Your own pipeline &mdash; the scheduled searches never touch this tab.</span>'+
    viewSwitchHtml()+'</div>'+
    // Same tiering as leadsTab: Add/search-equivalent controls stay
    // full-weight above, Sort (the one setting this tab has) drops to its
    // own quiet line rather than crowding the primary row.
    '<div class="key"><div class="sortwrap"><label class="sort-label" for="appSort">Sort</label>'+sortSelectHtml("applications","appSort")+'</div></div>';
  if(!A.length){
    return h+'<div class="card empty"><strong>No applications logged</strong>'+
      'When you apply to something, add it here to track the conversation. Days-since and the follow-up list update themselves.</div>';
  }

  if(ui.view==="grid"){
    h+=appsGridHtml(A);
    h+='<div class="note">Quick-scan columns only &mdash; referral, notes, team, setup, comp, and the rest are in Detail view (click a row to open them). Edits save when you click away. Days counts from the applied date.</div>';

  var sel=A.filter(function(a){return String(a.id)===String(ui.selected.applications);})[0]||A[0];

  var listHtml=A.map(function(a){

        '<span class="pill '+pillFor(a.status)+'">'+esc(a.status)+'</span></div>'+

      '<div class="md-row-loc"><span class="md-row-place">'+esc(a.location)+'</span>'+

// Which search tab an application came from, for the track line the header
// shares with leadDetailHtml. Read off the originating lead rather than
// stored: a lead an application points at is the one kind the server never
// deletes when its posting comes down (see setLeadStatus), so it's reliably
// still in state.leads. Returns "" for a hand-added application, which has no
// track to name - the line is then dropped rather than guessed at.
function appTrackLabel(a){
  if(!a.leadId)return "";
  var lead=state.leads.filter(function(l){return String(l.id)===String(a.leadId);})[0];
  return lead&&TRACKS[lead.search]?TRACKS[lead.search].label:"";
}

// The header mirrors leadDetailHtml's - track line, company, role, then a
// meta line of location, geo tier and the posting link - so moving between a
// search tab and this one doesn't mean re-reading a differently-shaped page
// for the same facts.
//
// The difference is that these are inputs, not text. An application can be
// added by hand and every part of it corrected later, which a lead (owned by
// the search that found it) never needs. So rather than drop the editing to
// match the look, the fields are styled as the headings they stand in for and
// show their box on hover/focus - same data-id/data-field/data-app contract
// as before, so commit() is unchanged.
function appDetailHtml(a){
  var d=daysSince(a.dateApplied);
  var g=geo(a.location);
  var track=appTrackLabel(a);
  var href=safeUrl(a.link);
  var fld=function(cls,field,val,ph){
    return '<input class="dh-in '+cls+'" type="text" data-id="'+a.id+'" data-field="'+field+
      '" data-app="1" value="'+esc(val||"")+'" placeholder="'+esc(ph)+'" aria-label="'+esc(ph)+'">';
  };
  var h='<div class="dh-app-top"><div class="dh-app-fields">'+
    (track?'<div class="dh-track">'+esc(track)+'</div>':'')+
    fld("dh-h1","company",a.company,"Company")+
    fld("dh-sub-in","title",a.title,"Role")+
    '<div class="dh-meta dh-app-meta">'+
      // Sized to its own text so it hugs the value the way the lead header's
      // plain location does, instead of a full-width box shoving the tier and
      // the link off to the far edge.
      '<input class="dh-in dh-loc-in" type="text" data-id="'+a.id+'" data-field="location" data-app="1"'+
        ' size="'+Math.max(14,Math.min(38,String(a.location||"").length+1))+'"'+
        ' value="'+esc(a.location)+'" placeholder="Location" aria-label="Location">'+
      (g?'<span class="geo '+g.p+'">'+esc(g.label)+'</span>':'')+
      (href?'<span class="dh-sep">&middot;</span><a href="'+esc(href)+'" target="_blank" rel="noopener">View posting &#8599;</a>':'')+
    '</div>'+
  '</div>'+
  '<button class="icon-btn danger" data-del="'+a.id+'" title="Remove application" aria-label="Remove application">'+TRASH_ICON+'</button>'+
  '</div>';
  h+='<div class="dh-status">'+selectHtml(APP_STATUS,a.status,'data-id="'+a.id+'" data-field="status" data-app="1"')+
    '<span class="dh-dates">Applied <input type="date" data-id="'+a.id+'" data-field="dateApplied" data-app="1" value="'+esc(a.dateApplied)+'">'+
      (d!==null?' &middot; '+d+' days':'')+'</span></div>';
  h+=factsCardsHtml(a,true,false);
  h+='<div class="dh-notes"><div class="mf-label">Notes</div>'+
    '<textarea data-id="'+a.id+'" data-field="notes" data-app="1" rows="3">'+esc(a.notes)+'</textarea></div>';
  return h;
}

function render(){
  var tabs=buildTabs();
  // ui.tab is restored from localStorage, so it can name a track that has
  // since been removed from config (POST /api/config replaces the whole
  // track list). Fall back to the first tab rather than rendering a track
  // panel for a key TRACKS no longer has.
  var current=tabs.filter(function(t){return t.id===ui.tab;})[0];
  if(!current){current=tabs[0]; ui.tab=current.id;}
  document.getElementById("tabs").innerHTML=tabsHtml();
  var p=document.getElementById("panel");
  // Re-rendering replaces the master-detail list wholesale, which would
  // otherwise reset its scroll position to the top on every click -
  // including just selecting a different row. Preserve it across the swap.
  var oldList=p.querySelector(".md-list"), scrollTop=oldList?oldList.scrollTop:null;
  if(current.kind==="overview")p.innerHTML=dashboard();
  else if(current.kind==="applications")p.innerHTML=appsTab();
  else p.innerHTML=leadsTab(current.id);
  var newList=p.querySelector(".md-list");
  if(newList){
    if(scrollTop!==null){
      newList.scrollTop=scrollTop;
    }else{
      // No previous list to carry a scroll position over from - e.g.
      // switching in from Grid view, where the selected row (highlighted
      // via a grid click, see the data-expand handler below) can be far
      // down the list. Scroll it into view instead of defaulting to the
      // top, so Detail view doesn't hide the very row you just picked.
      var selRow=newList.querySelector(".md-row.sel");
      if(selRow)selRow.scrollIntoView({block:"nearest"});
    }
  }
}

document.addEventListener("click",function(e){
  if(e.target.id==="stageDateSave"){confirmStageDate();return;}
  if(e.target.id==="stageDateCancel"){closeStageDateModal(true);return;}
  // The overlay itself, not anything inside the card - a click on the
  // dimmed backdrop cancels, same as Cancel.
  if(e.target.id==="stageDateModal"){closeStageDateModal(true);return;}
  if(e.target.id==="tokenSubmit"){submitToken();return;}
  if(e.target.id==="logout"){logout();return;}
  if(e.target.closest("#themeToggle")){toggleTheme();return;}

  var t=e.target.closest("[data-tab]");
  if(t){ui.tab=t.getAttribute("data-tab");ui.q="";ui.filter="All";
    try{localStorage.setItem("bjs.tab",ui.tab);}catch(err){} render(); return;}

  var f=e.target.closest("[data-filter]");
  if(f){ui.filter=f.getAttribute("data-filter"); render(); return;}

  var vw=e.target.closest("[data-view]");
  if(vw){
    ui.view=vw.getAttribute("data-view");
    try{localStorage.setItem("bjs.view",ui.view);}catch(err){}
    render();
    return;
  }

  var sr=e.target.closest("[data-select]");
  if(sr){
    var scope=sr.getAttribute("data-scope");
    ui.selected[scope]=sr.getAttribute("data-select");
    render();
    return;
  }

  // data-expand lives on the grid <tr> itself, so any click on the row
  // toggles it - except clicks on an actual form control (editing a
  // field, opening the status select, following the posting link,
  // clicking Remove), which fall through to their own handling below.
  var ex=e.target.closest("[data-expand]");
  if(ex&&!e.target.closest("input,select,textarea,a,button")){
    var exId=ex.getAttribute("data-expand"), exScope=ex.getAttribute("data-scope");
    ui.expanded[exId]=!ui.expanded[exId];
    // Clicking a row - opening or closing it - is what "highlights" it:
    // it's the row Detail view lands on when you switch there.
    ui.selected[exScope]=exId;
    render();
    return;
  }

  if(e.target.id==="addapp"){
    setSaved("Saving…",false);
    api("/api/update",{method:"POST",body:JSON.stringify({
      type:"application",company:"",title:"",location:"",dateApplied:today(),status:"Applied",notes:"",
      team:"",setup:"",source:"",link:"",resume:"",referral:"",comp:""
    })}).then(function(res){
      state.applications.unshift(res.application);
      render();
      setSaved("Saved",true);
    }).catch(function(){setSaved("Couldn't save — try again","bad");});
    return;
  }

  var del=e.target.closest("[data-del]");
  // Removing a posting asks for a reason rather than just confirming. The
  // reason is stored on the screened row the removal leaves behind, which is
  // both the only lasting record of why it went and the thing that stops
  // tomorrow's run rediscovering the URL and adding it straight back.
  var rmLead=e.target.closest("[data-rmlead]");
  if(rmLead){
    var lid=rmLead.getAttribute("data-rmlead");
    var lrow=(state.leads||[]).filter(function(x){return String(x.id)===String(lid);})[0];
    var lname=lrow?((lrow.company||"")+" "+(lrow.title||"")).trim():"this posting";
    var why=prompt("Remove "+lname+"?\n\nWhy? This is kept so the search doesn't find it again.","outside target locations");
    if(why!==null&&why.trim()){
      setSaved("Saving…",false);
      api("/api/delete-leads",{method:"POST",body:JSON.stringify({ids:[lid],reason:why.trim()})}).then(function(r){
        if(r&&r.kept&&r.kept.length){setSaved("Kept — an application points at it","bad");return;}
        state.leads=(state.leads||[]).filter(function(x){return String(x.id)!==String(lid);});
        boot();
      }).catch(function(){setSaved("Couldn't save — try again","bad");});
    }
    return;
  }

  if(del){
    var id=del.getAttribute("data-del");
    var row=state.applications.filter(function(a){return String(a.id)===String(id);})[0];
    var name=row&&(row.company||row.title)?((row.company||"")+" "+(row.title||"")).trim():"this row";
    if(confirm("Remove "+name+" from Applications?")){
      setSaved("Saving…",false);
      api("/api/delete-application",{method:"POST",body:JSON.stringify({id:id})}).then(function(){
        state.applications=state.applications.filter(function(a){return String(a.id)!==String(id);});
        render();
        setSaved("Saved",true);
      }).catch(function(){setSaved("Couldn't save — try again","bad");});
    }
  }
});
