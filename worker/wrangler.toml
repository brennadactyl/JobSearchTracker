name = "job-search-tracker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# src/page.html is imported as a plain string (see src/index.js) rather
# than bundled as a module.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Created by: wrangler d1 create job-search-tracker-db
# Paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "job-search-tracker-db"
database_id = "104f139f-bc84-4e72-8034-8541ef563ae4"
migrations_dir = "./migrations"
