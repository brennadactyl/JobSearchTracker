<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F5F9; --surface:#FFFFFF; --surface2:#ECEEF6; --line:#DCDFEB;
  --ink:#14172A; --ink2:#555B77; --ink3:#868CA6;
  --accent:#A96C15; --accent-soft:#F6EBD8;
  --good:#226642; --warn:#96600F; --crit:#A93A31;
  --pri-high:#0F7B6C; --pri-high-soft:#D8EEEA;
  --pri-med:#5E8A83; --pri-med-soft:#E8F0EE;
  --shadow:0 1px 2px rgba(20,23,42,.06),0 8px 24px -12px rgba(20,23,42,.18);
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0E1018; --surface:#161925; --surface2:#1E2230; --line:#2A2F41;
  --ink:#E9EBF4; --ink2:#A3AAC3; --ink3:#717892;
  --accent:#E0A544; --accent-soft:#33280F;
  --good:#4FBE85; --warn:#DFA63C; --crit:#E8756A;
  --pri-high:#4FD1B8; --pri-high-soft:#10322D;
  --pri-med:#7FA9A2; --pri-med-soft:#1A2A27;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px 72px}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;margin:0;letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.hdr{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;justify-content:space-between;padding:30px 0 18px}
.hdr h1{font-size:clamp(24px,3.6vw,33px);font-weight:700}
.hdr .sub{color:var(--ink2);font-size:14px;margin-top:5px}
.stamp{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:9px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.dot.off{background:var(--ink3)}
.dot.bad{background:var(--crit)}

.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
  background:var(--ground);padding-top:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;border:0;background:none;cursor:pointer;color:var(--ink2);
  font:inherit;font-weight:500;padding:11px 14px;border-bottom:2px solid transparent;
  white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);
  background:var(--surface2);padding:1px 6px;border-radius:9px}
.tab[aria-selected="true"] .n{color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:16px 0 12px}
.search{flex:1;min-width:180px;max-width:320px}
input[type=search],input[type=text],input[type=date],input[type=password],select,textarea{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;width:100%}
textarea{resize:vertical;min-height:34px}
.btn{appearance:none;font:inherit;font-weight:500;cursor:pointer;border-radius:7px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#241B08}}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding:6px 9px}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}

.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{appearance:none;font:inherit;font-size:13px;cursor:pointer;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:4px 11px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.scroller{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
tr.more-row:hover{background:none}
tr.more-row td{padding:4px 12px 14px}
.co{font-weight:600;white-space:nowrap}
.dt{color:var(--ink3);font-size:12.5px;white-space:nowrap}
.geo{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;
  padding:2px 8px;border-radius:99px;white-space:nowrap}
.geo.p-high{background:var(--pri-high-soft);color:var(--pri-high)}
.geo.p-med{background:var(--pri-med-soft);color:var(--pri-med)}
.key{display:flex;gap:15px;flex-wrap:wrap;align-items:center;font-size:12.5px;
  color:var(--ink3);padding:0 0 11px}
.key i{display:inline-block;width:3px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}

.viewsw{display:flex;gap:2px;margin-left:auto;background:var(--surface2);padding:3px;border-radius:8px}
.vbtn{appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink2);padding:5px 12px;border-radius:6px;cursor:pointer}
.vbtn[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.vbtn:hover{color:var(--ink)}

/* Dense grid: the same records as one wide, fully-editable table -
   maximum information density, everything visible without a click. */
.grid-wrap{overflow-x:auto}
.grid-wrap a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--line)}
.grid-wrap a:hover{border-bottom-color:var(--accent)}
.loc{color:var(--ink2);font-size:13px;max-width:200px}
.loc-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .geo{display:inline-block;margin-top:3px}
td.rc{max-width:260px}
td.rc a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.cc{max-width:170px;overflow:hidden;text-overflow:ellipsis}
td:first-child{border-left:3px solid transparent}
tr.p-high td:first-child{border-left-color:var(--pri-high)}
tr.p-med td:first-child{border-left-color:var(--pri-med)}
td select{padding:5px 7px;font-size:13px;min-width:112px}
td input[type=text],td input[type=date]{font-size:13px;min-width:104px}
td textarea{font-size:13px;min-height:32px;min-width:130px}
.grid-wrap tbody tr[data-expand]{cursor:pointer}
.grid-wrap tbody tr.gr-sel{background:var(--accent-soft)}
.grid-wrap tbody tr.gr-sel:hover{background:var(--accent-soft)}
.exp-ind{color:var(--ink3);font-size:12.5px;white-space:nowrap}

/* Master-detail: a compact list on the left, the full record on the right -
   no expand/collapse, every field is one click away. Used by both the
   per-track leads tabs and Applications. */
.md{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.md-list{width:348px;flex:0 0 348px;border-right:1px solid var(--line);
  overflow-y:auto;overflow-x:hidden;max-height:min(720px,calc(100vh - 260px))}
.md-row{padding:12px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent;
  cursor:pointer}
.md-row:last-child{border-bottom:0}
.md-row:hover{background:var(--surface2)}
.md-row.sel{background:var(--accent-soft)}
.md-row.sel:hover{background:var(--accent-soft)}
.md-row.p-high{border-left-color:var(--pri-high)}
.md-row.p-med{border-left-color:var(--pri-med)}
.md-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.md-row-top .co{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.md-row-top .pill{flex:0 0 auto}
.md-row-ttl{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.4}
.md-row-loc{font-size:11.5px;color:var(--ink3);margin-top:7px}
.md-row-loc .geo{margin-left:6px;padding:1px 7px}
.md-detail{flex:1;min-width:0;padding:22px 28px;overflow-y:auto;
  max-height:min(720px,calc(100vh - 260px))}
.md-empty{padding:70px 20px;text-align:center;color:var(--ink3)}
.dh-track{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.dh-head h1{font-size:21px;margin-top:6px}
.dh-sub{font-size:14.5px;color:var(--ink2);margin-top:2px}
.dh-meta{font-size:12.5px;color:var(--ink3);margin-top:7px}
.dh-meta a{color:var(--accent)}
.dh-fit{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.5}
.dh-app-head{display:flex;gap:14px;flex-wrap:wrap}
.dh-app-head .mf{flex:1;min-width:180px}
.dh-status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.dh-status select{width:auto;min-width:150px}
.dh-status input[type=date]{width:auto}
.dh-dates{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.dh-notes{margin-top:18px}
.mf-label{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.facts-card{margin-top:20px;padding:16px 18px;background:var(--surface2);border:1px solid var(--line);border-radius:10px}
.facts-card .more-grid{padding:0}
@media (max-width:900px){
  .md{flex-direction:column}
  .md-list{width:100%;flex:none;border-right:0;border-bottom:1px solid var(--line);max-height:280px}
  .md-detail{max-height:none}
}

.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  border:1px solid transparent;white-space:nowrap}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.live{background:var(--surface2);color:var(--ink2)}
.pill.go{background:var(--surface2);color:var(--good);border-color:var(--good)}
.pill.no{background:none;color:var(--ink3);border-color:var(--line)}
.pill.hot{background:var(--surface2);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:none;color:var(--crit);border-color:var(--crit)}

.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));margin-bottom:20px}
.tile{padding:16px 17px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.tile .v{font-family:"Bricolage Grotesque",sans-serif;font-size:31px;font-weight:700;line-height:1.15;margin-top:7px;letter-spacing:-.03em}
.tile .f{font-size:12.5px;color:var(--ink2);margin-top:3px}
.tile.hi .v{color:var(--accent)}

.bars{display:flex;flex-direction:column;gap:13px}
.bar h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between;
  align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin-bottom:7px}
.bar h3 span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3);font-weight:400}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--ink2)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

.sec{margin:26px 0 11px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec h2{font-size:17px;font-weight:700}
.sec p{margin:0;font-size:13px;color:var(--ink3)}

.empty{padding:44px 22px;text-align:center;color:var(--ink3)}
.empty strong{display:block;color:var(--ink2);font-weight:600;margin-bottom:5px;font-size:15px}

.more-grid{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mf label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px;font-weight:600}
.note{font-size:12.5px;color:var(--ink3);padding:14px 0 0;line-height:1.6}
@media (max-width:900px){
  .wrap{padding:0 13px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#gate{position:fixed;inset:0;background:var(--ground);display:flex;align-items:center;justify-content:center;padding:20px}
#gate .card{padding:26px 30px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
#gate h1{font-size:19px}
#gate p{margin:0;color:var(--ink2);font-size:13px}
#gate .err{color:var(--crit);font-size:12.5px;min-height:1em}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>Job search access</h1>
    <p>Enter your access token to continue.</p>
    <input id="tokenInput" type="password" placeholder="Token">
    <button class="btn primary" id="tokenSubmit">Enter</button>
    <div id="gateError" class="err"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <div class="hdr">
      <div>
        <h1 id="appTitle">Job Search Tracker</h1>
        <div class="sub" id="appSub">Verified openings, refreshed daily. Edit anything &mdash; it saves for every device.</div>
      </div>
      <div class="stamp"><span class="dot" id="savedot"></span><span id="savetext">Loading</span></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <main id="panel"></main>
  </div>
</div>

<script>
(function(){
"use strict";

var LEAD_STATUS=["New","Reviewing","Applied","Not a fit","Closed"];
var APP_STATUS=["Applied","Recruiter Screen","Tech Screen","Onsite / Loop","Offer","Rejected","Withdrawn"];
var ACTIVE=["Recruiter Screen","Tech Screen","Onsite / Loop"];
// Populated from state.tracks on boot (see buildTracks/applyConfig below) -
// not baked in, so this same deployed code serves any installer's tracks.
var TRACKS={};

var TOKEN=localStorage.getItem("tracker_token")||"";
var state={updated:null,leads:[],applications:[],tracks:[],settings:{display_title:"Job Search Tracker",priority_locations:[]}};

// Turns the API's tracks[] (rows: key/label/full_description/sort_order)
// into the {key:{label,full}} shape the rest of the page indexes by, in
// display order.
function buildTracks(list){
  var t={};
  (list||[]).slice().sort(function(a,b){
    return (a.sort_order-b.sort_order)||String(a.key).localeCompare(String(b.key));
  }).forEach(function(tr){ t[tr.key]={label:tr.label,full:tr.full_description}; });
  return t;
}

// Applies state.tracks/state.settings (from /api/data) to TRACKS and the
// header, replacing the "Brenna's Job Search" / fixed-track defaults.
function applyConfig(){
  TRACKS=buildTracks(state.tracks);
  var title=(state.settings&&state.settings.display_title)||"Job Search Tracker";
  document.title=title;
  var titleEl=document.getElementById("appTitle"); if(titleEl)titleEl.textContent=title;
  var n=state.tracks.length;
  var subEl=document.getElementById("appSub");
  if(subEl)subEl.textContent="Verified openings across "+n+" tracked search"+(n===1?"":"es")+
    ", refreshed daily. Edit anything — it saves for every device.";
}
var ui={tab:"dashboard",q:"",filter:"All",selected:{},expanded:{},view:"detail"};

// Fields shown in a lead's detail panel. These are DB columns shared with
// applications (see migrations/), minus "link" - a lead already has its own
// url (the header link points at it), so a second link input here would
// just duplicate it. Applications get a dedicated Link field instead
// (APP_EXTRA_FIELDS below), since a manually-added application has no
// posting URL to fall back on.
var EXTRA_FIELDS=[
  ["referral","Referral"],
  ["comp","Comp range"],
  ["source","Source"],
  ["team","Team / product"],
  ["setup","Setup"],
  ["resume","Resume"],
  ["lastContact","Last contact","date"],
  ["nextAction","Next action"],
  ["nextActionDate","When","date"]
];
var APP_EXTRA_FIELDS=EXTRA_FIELDS.slice(0,5).concat([["link","Link"]]).concat(EXTRA_FIELDS.slice(5));

function factsGridHtml(item,fields,isApp){
  var appAttr=isApp?' data-app="1"':'';
  return '<div class="more-grid">'+fields.map(function(f){
    var key=f[0],label=f[1],type=f[2]||"text";
    var val=item[key]||"";
    var input=type==="date"
      ?'<input type="date" data-id="'+item.id+'" data-field="'+key+'"'+appAttr+' value="'+esc(val)+'">'
      :'<input type="text" data-id="'+item.id+'" data-field="'+key+'"'+appAttr+' value="'+esc(val)+'" placeholder="'+esc(label)+'">';
    return '<div class="mf"><label>'+esc(label)+'</label>'+input+'</div>';
  }).join("")+'</div>';
}
try{var s=localStorage.getItem("bjs.tab");if(s)ui.tab=s;}catch(e){}
try{var vw0=localStorage.getItem("bjs.view");if(vw0)ui.view=vw0;}catch(e){}

function viewSwitchHtml(){
  return '<div class="viewsw">'+
    '<button class="vbtn" data-view="detail" aria-pressed="'+(ui.view!=="grid")+'">Detail</button>'+
    '<button class="vbtn" data-view="grid" aria-pressed="'+(ui.view==="grid")+'">Grid</button>'+
  '</div>';
}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function daysSince(d){if(!d)return null;var t=Date.parse(d);if(isNaN(t))return null;
  return Math.max(0,Math.floor((Date.now()-t)/86400000));}

function today(){return new Date().toISOString().slice(0,10);}

// Evaluates state.settings.priority_locations (see migrations/
// 0003_add_tracks_and_settings.sql) - an ordered list of {tier, label, anyOf,
// allOf} rules, first match wins. Was a hard-coded Seattle/Portland lookup;
// now it's whatever an installer's config says, with the search-substring
// semantics unchanged (anyOf: at least one substring present; allOf,
// optional: every substring present).
function geo(location){
  var loc=String(location||"").toLowerCase();
  var rules=(state.settings&&state.settings.priority_locations)||[];
  for(var i=0;i<rules.length;i++){
    var r=rules[i];
    if(r.allOf&&!r.allOf.every(function(s){return loc.indexOf(s)>=0;}))continue;
    if(r.anyOf&&!r.anyOf.some(function(s){return loc.indexOf(s)>=0;}))continue;
    return {p:r.tier,label:r.label};
  }
  return null;
}
function rank(l){var g=geo(l.location);return g?(g.p==="p-high"?0:1):2;}

function setSaved(msg,ok){
  var d=document.getElementById("savedot"),t=document.getElementById("savetext");
  if(!d)return; d.className="dot"+(ok===false?" off":ok==="bad"?" bad":"");
  t.textContent=msg;
}

function submitToken(){
  TOKEN=document.getElementById("tokenInput").value.trim();
  if(!TOKEN)return;
  localStorage.setItem("tracker_token",TOKEN);
  boot();
}

function api(path,opts){
  var headers={"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};
  if(opts&&opts.headers){for(var k in opts.headers){headers[k]=opts.headers[k];}}
  var merged={};
  if(opts){for(var k2 in opts){merged[k2]=opts[k2];}}
  merged.headers=headers;
  return fetch(path,merged).then(function(res){
    if(res.status===401){
      localStorage.removeItem("tracker_token");
      document.getElementById("gate").classList.remove("hidden");
      document.getElementById("app").classList.add("hidden");
      document.getElementById("gateError").textContent="Invalid token.";
      throw new Error("unauthorized");
    }
    return res.json();
  });
}

function boot(){
  setSaved("Loading",false);
  api("/api/data").then(function(data){
    state=data;
    if(!state.leads)state.leads=[];
    if(!state.applications)state.applications=[];
    if(!Array.isArray(state.tracks))state.tracks=[];
    if(!state.settings)state.settings={display_title:"Job Search Tracker",priority_locations:[]};
    applyConfig();
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    setSaved("Saved",true);
    render();
  }).catch(function(err){
    var el=document.getElementById("gateError");
    if(el&&err.message!=="unauthorized")el.textContent="Couldn't load: "+err.message;
  });
}

function tabsHtml(){
  var t=[{id:"dashboard",label:"Overview",n:null},
         {id:"applications",label:"Applications",n:state.applications.length}];
  Object.keys(TRACKS).forEach(function(k){
    // Applied leads have moved to the Applications tab (see moveToApplications())
    // and don't show in this track's list, so they don't count toward its badge.
    t.push({id:k,label:TRACKS[k].label,n:state.leads.filter(function(l){return l.search===k&&l.status!=="Applied";}).length});
  });
  return t.map(function(x){
    return '<button class="tab" role="tab" data-tab="'+x.id+'" aria-selected="'+(ui.tab===x.id)+'">'+
      esc(x.label)+(x.n!==null?'<span class="n">'+x.n+'</span>':'')+'</button>';
  }).join("");
}

// A lead's original posting can be confirmed taken down independent of
// `status` (which is the installer's own application-progress field) - so
// an "Applied" lead can still show as delisted without status being touched
// or overwritten. See migrations/0004_add_lead_delisted.sql.
function delistedBadge(l){
  return l.delistedOn?' <span class="pill bad" title="Original posting confirmed no longer live">Delisted '+esc(l.delistedOn)+'</span>':"";
}

function pillFor(st){
  var m={"New":"new","Reviewing":"hot","Applied":"go","Not a fit":"no","Closed":"no",
         "Recruiter Screen":"hot","Tech Screen":"hot","Onsite / Loop":"hot","Offer":"go",
         "Rejected":"bad","Withdrawn":"no"};
  return m[st]||"live";
}

function selectHtml(opts,val,attrs){
  var list=opts.slice();
  if(val&&list.indexOf(val)<0)list.push(val);
  return '<select '+attrs+'>'+list.map(function(o){
    return '<option'+(o===val?" selected":"")+'>'+esc(o)+'</option>';}).join("")+'</select>';
}

function dashboard(){
  var L=state.leads, A=state.applications;
  var fresh=L.filter(function(l){return l.status==="New";}).length;
  var active=A.filter(function(a){return ACTIVE.indexOf(a.status)>=0;}).length;

    return g&&g.p==="p-high"&&l.status!=="Not a fit"&&l.status!=="Closed"&&l.status!=="Applied";}).length;
  var topRule=(state.settings.priority_locations||[]).filter(function(r){return r.tier==="p-high";})[0];

  var h='<div class="tiles">'+
    '<div class="tile hi"><div class="k">Untriaged</div><div class="v mono">'+fresh+'</div><div class="f">leads marked New</div></div>'+
    '<div class="tile"><div class="k">'+esc(topLabel)+'</div><div class="v mono" style="color:var(--pri-high)">'+near+'</div><div class="f">still open</div></div>'+
    '<div class="tile"><div class="k">Tracked leads</div><div class="v mono">'+L.length+'</div><div class="f">across '+trackCount+' tracked search'+(trackCount===1?'':'es')+'</div></div>'+
    '<div class="tile"><div class="k">Applied</div><div class="v mono">'+A.length+'</div><div class="f">in your Applications tab</div></div>'+
    '<div class="tile"><div class="k">In conversation</div><div class="v mono">'+active+'</div><div class="f">screen or loop stage</div></div>'+
    '<div class="tile"><div class="k">Gone quiet</div><div class="v mono">'+stale+'</div><div class="f">applied 14+ days ago</div></div>'+
  '</div>';

  h+='<div class="card" style="padding:19px"><div class="bars">';
  Object.keys(TRACKS).forEach(function(k){
    var rows=state.leads.filter(function(l){return l.search===k;});
    var byStatus=LEAD_STATUS.map(function(st){
      return {s:st,n:rows.filter(function(r){return r.status===st;}).length};});
    var tot=rows.length||1;
    var cols={"New":"var(--accent)","Reviewing":"var(--warn)","Applied":"var(--good)",
              "Not a fit":"var(--line)","Closed":"var(--line)"};
    h+='<div class="bar"><h3>'+esc(TRACKS[k].label)+' <span>'+esc(TRACKS[k].full)+' &middot; '+rows.length+'</span></h3>'+
      '<div class="meter">'+byStatus.map(function(b){
        return b.n?'<i style="width:'+(b.n/tot*100)+'%;background:'+cols[b.s]+'"></i>':"";}).join("")+'</div>'+
      '<div class="legend">'+byStatus.filter(function(b){return b.n;}).map(function(b){
        return '<span><b style="background:'+cols[b.s]+'"></b>'+esc(b.s)+' '+b.n+'</span>';}).join("")+
      (rows.length?"":'<span style="color:var(--ink3)">No postings found yet</span>')+'</div></div>';
  });
  h+='</div></div>';

  var todo=A.filter(function(a){return a.nextAction;})
    .sort(function(x,y){return String(x.nextActionDate||"9999").localeCompare(String(y.nextActionDate||"9999"));});
  h+='<div class="sec"><h2>What&rsquo;s next</h2><p>From your Applications tab</p></div>';
  if(!todo.length){

  }else{

function leadsTab(key){
  // A lead marked "Applied" has moved to the Applications tab (see
  // moveToApplications()) - it's still in state.leads underneath (so URL
  // dedup and delistedOn tracking keep working), just no longer shown here.
  var all=state.leads.filter(function(l){return l.search===key&&l.status!=="Applied";});
  var q=ui.q.toLowerCase();
  var rows=all.filter(function(l){
    if(ui.filter!=="All"&&l.status!==ui.filter)return false;
    if(!q)return true;
    return (l.company+" "+l.title+" "+l.location).toLowerCase().indexOf(q)>=0;
  }).sort(function(a,b){
    var d=rank(a)-rank(b); if(d)return d;
    return String(b.found).localeCompare(String(a.found));
  });
  var tierVar={"p-high":"var(--pri-high)","p-med":"var(--pri-med)"};
  var geoKeyHtml=(state.settings.priority_locations||[]).map(function(r){
    return '<span><i style="background:'+(tierVar[r.tier]||"var(--ink3)")+'"></i>'+esc(r.label)+'</span>';
  }).join("");
  var h='<div class="toolbar">'+
    '<div class="search"><input type="search" id="q" placeholder="Filter '+esc(TRACKS[key].label)+'&hellip;" value="'+esc(ui.q)+'"></div>'+
    '<div class="chips">'+["All"].concat(LEAD_STATUS.filter(function(s){return s!=="Applied";})).map(function(f){
      return '<button class="chip" data-filter="'+esc(f)+'" aria-pressed="'+(ui.filter===f)+'">'+esc(f)+'</button>';
    }).join("")+'</div>'+viewSwitchHtml()+'</div>'+
    '<div class="key">'+geoKeyHtml+'<span>Closest roles sorted first</span></div>';

  if(!all.length){
    return h+'<div class="card empty"><strong>No postings yet</strong>The '+esc(TRACKS[key].label).toLowerCase()+
      ' search hasn&rsquo;t turned up a verified opening yet. An empty day is a real result &mdash; nothing gets padded in here.</div>';
  }
  if(!rows.length) return h+'<div class="card empty"><strong>Nothing matches</strong>Try a different filter.</div>';

  if(ui.view==="grid"){
    h+=leadsGridHtml(rows,key);
    h+='<div class="note">Quick-scan columns only &mdash; referral, notes, team, setup, source, and the rest are in Detail view (click a row to open them). Edits save when you click away. '+rows.length+' of '+all.length+' shown.</div>';
    return h;
  }

  var sel=rows.filter(function(l){return String(l.id)===String(ui.selected[key]);})[0]||rows[0];
  ui.selected[key]=sel.id;

  var listHtml=rows.map(function(l){
    var g=geo(l.location);
    var cls="md-row"+(l.id===sel.id?" sel":"")+(g?" "+g.p:"");
    return '<div class="'+cls+'" data-select="'+l.id+'" data-scope="'+key+'">'+
      '<div class="md-row-top"><span class="co">'+esc(l.company)+'</span>'+
        '<span class="pill '+pillFor(l.status)+'">'+esc(l.status)+'</span>'+delistedBadge(l)+'</div>'+
      '<div class="md-row-ttl">'+esc(l.title)+'</div>'+
      '<div class="md-row-loc">'+esc(l.location)+(g?'<span class="geo '+g.p+'">'+esc(g.label)+'</span>':'')+'</div>'+
    '</div>';
  }).join("");

  h+='<div class="md"><div class="md-list">'+listHtml+'</div><div class="md-detail">'+leadDetailHtml(sel,key)+'</div></div>';
  h+='<div class="note">Status, notes, and details save when you click away from the field. '+rows.length+' of '+all.length+' shown.</div>';
  return h;

function render(){
  document.getElementById("tabs").innerHTML=tabsHtml();
  var p=document.getElementById("panel");
  // Re-rendering replaces the master-detail list wholesale, which would
  // otherwise reset its scroll position to the top on every click -
  // including just selecting a different row. Preserve it across the swap.
  var oldList=p.querySelector(".md-list"), scrollTop=oldList?oldList.scrollTop:0;
  if(ui.tab==="dashboard")p.innerHTML=dashboard();
  else if(ui.tab==="applications")p.innerHTML=appsTab();
  else p.innerHTML=leadsTab(ui.tab);
  var newList=p.querySelector(".md-list");
  if(newList)newList.scrollTop=scrollTop;
}

document.addEventListener("click",function(e){
  if(e.target.id==="tokenSubmit"){submitToken();return;}

  var t=e.target.closest("[data-tab]");
  if(t){ui.tab=t.getAttribute("data-tab");ui.q="";ui.filter="All";
    try{localStorage.setItem("bjs.tab",ui.tab);}catch(err){} render(); return;}

  var f=e.target.closest("[data-filter]");
  if(f){ui.filter=f.getAttribute("data-filter"); render(); return;}

  var vw=e.target.closest("[data-view]");
  if(vw){
    ui.view=vw.getAttribute("data-view");
    try{localStorage.setItem("bjs.view",ui.view);}catch(err){}
    render();
    return;
  }

  var sr=e.target.closest("[data-select]");
  if(sr){
    var scope=sr.getAttribute("data-scope");
    ui.selected[scope]=sr.getAttribute("data-select");
    render();
    return;
  }

  // data-expand lives on the grid <tr> itself, so any click on the row
  // toggles it - except clicks on an actual form control (editing a
  // field, opening the status select, following the posting link,
  // clicking Remove), which fall through to their own handling below.
  var ex=e.target.closest("[data-expand]");
  if(ex&&!e.target.closest("input,select,textarea,a,button")){
    var exId=ex.getAttribute("data-expand"), exScope=ex.getAttribute("data-scope");
    ui.expanded[exId]=!ui.expanded[exId];
    // Clicking a row - opening or closing it - is what "highlights" it:
    // it's the row Detail view lands on when you switch there.
    ui.selected[exScope]=exId;
    render();
    return;
  }

  if(e.target.id==="addapp"){
    setSaved("Saving…",false);
    api("/api/update",{method:"POST",body:JSON.stringify({
      type:"application",company:"",title:"",dateApplied:today(),status:"Applied",notes:"",
      team:"",setup:"",source:"",link:"",lastContact:"",nextAction:"",nextActionDate:"",
      resume:"",referral:"",comp:""
    })}).then(function(res){
      state.applications.unshift(res.application);
      render();
      setSaved("Saved",true);
    }).catch(function(){setSaved("Couldn't save — try again","bad");});
    return;
  }

  var del=e.target.closest("[data-del]");
  if(del){
    var id=del.getAttribute("data-del");
    var row=state.applications.filter(function(a){return String(a.id)===String(id);})[0];
    var name=row&&(row.company||row.title)?((row.company||"")+" "+(row.title||"")).trim():"this row";
    if(confirm("Remove "+name+" from Applications?")){
      setSaved("Saving…",false);
      api("/api/delete-application",{method:"POST",body:JSON.stringify({id:id})}).then(function(){
        state.applications=state.applications.filter(function(a){return String(a.id)!==String(id);});
        render();
        setSaved("Saved",true);
      }).catch(function(){setSaved("Couldn't save — try again","bad");});
    }
  }
});

document.addEventListener("keydown",function(e){
  if(e.target.id==="tokenInput"&&e.key==="Enter"){submitToken();}
});

document.addEventListener("input",function(e){
  if(e.target.id==="q"){
    ui.q=e.target.value;
    var pos=e.target.selectionStart; render();
    var n=document.getElementById("q"); if(n){n.focus();n.setSelectionRange(pos,pos);}
  }
});

function commit(el){
  var id=el.getAttribute("data-id"), field=el.getAttribute("data-field");
  if(!id||!field)return;
  var isApp=!!el.getAttribute("data-app");
  var list=isApp?state.applications:state.leads;
  var row=list.filter(function(r){return String(r.id)===String(id);})[0];
  if(!row||row[field]===el.value)return;
  row[field]=el.value;
  setSaved("Saving…",false);
  var body=isApp?{type:"application",id:id}:{type:"lead",id:id};
  body[field]=el.value;
  api("/api/update",{method:"POST",body:JSON.stringify(body)}).then(function(){
    setSaved("Saved",true);
    if(field==="status"&&!isApp){
      if(el.value==="Applied")moveToApplications(row);
      render();
    }
  }).catch(function(){setSaved("Couldn't save — try again","bad");});
}

// Marking a lead "Applied" moves it to the Applications tab - a lead's
// status and an application's pipeline stage are different things (compare
// LEAD_STATUS to APP_STATUS), so this creates a real application row rather
// than stretching the lead's own status to cover interview stages later.
// The lead row itself is untouched beyond its status: it stays in
// state.leads/the DB (URL dedup and delistedOn tracking both need it to
// still exist), it just no longer shows in the Leads tab - see leadsTab().
function moveToApplications(lead){
  if(state.applications.some(function(a){return String(a.leadId)===String(lead.id);}))return; // already moved once
  var body={type:"application",company:lead.company,title:lead.title,dateApplied:today(),
    status:"Applied",notes:lead.notes||"",leadId:String(lead.id),link:lead.url||""};
  EXTRA_FIELDS.forEach(function(f){body[f[0]]=lead[f[0]]||"";});
  api("/api/update",{method:"POST",body:JSON.stringify(body)}).then(function(res){
    state.applications.unshift(res.application);
    render();
  }).catch(function(){setSaved("Applied, but couldn't add it to Applications - add it there manually","bad");});
}
document.addEventListener("change",function(e){
  if(e.target.matches("select[data-id],input[data-id]"))commit(e.target);
});
document.addEventListener("focusout",function(e){
  if(e.target.matches("textarea[data-id],input[data-id]"))commit(e.target);
});

if(TOKEN)boot(); else document.getElementById("gate").classList.remove("hidden");
})();
</script>
